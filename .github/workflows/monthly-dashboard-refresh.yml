# Monthly dashboard refresh - GitHub Actions deployment.
#
# WHAT THIS DOES AND DOES NOT TOUCH:
#   It refreshes ONLY the dashboard's unlocked "recent" extension
#   (phase2/data/extended/GSPC_2023_present.csv) and rebuilds dashboard/index.html
#   + dashboard/dashboard_data.json from it.
#
#   It NEVER touches: data/, phase2/data/GSPC_2023_2026-10-02.csv,
#   phase2/oos_validation_criteria.yaml, phase2/preregistration.lock,
#   seasonal_patterns_2003_2022.json, or anything the formal, pre-registered
#   out-of-sample validation depends on. That validation is a frozen, one-shot
#   test as of hard_stop = 2026-10-02 and stays exactly as it is forever -
#   see dashboard/build_data.py's comments and dashboard/README.md.
#
#   dashboard/build_data.py cross-checks every locked number against the
#   frozen research files on every build (same as it always has) and the
#   build FAILS if anything locked disagrees - this workflow adds a new data
#   source on top, it does not weaken that check.
name: Monthly Dashboard Refresh

on:
  schedule:
    # 06:00 UTC on the 5th of each month - comfortably after month-end data
    # settles, matching the "err late rather than early" convention used by
    # the sibling seasonal-screener repo's weekly workflow.
    - cron: "0 6 5 * *"
  # Manual trigger for an ad-hoc refresh (e.g. right after you've added a
  # month's worth of trading days and want the dashboard updated now, rather
  # than waiting for the next scheduled run).
  workflow_dispatch:

# Minimal permissions: this workflow only needs to push the refreshed
# extension data + rebuilt dashboard back to the repository.
permissions:
  contents: write

concurrency:
  group: monthly-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pyyaml scipy

      - name: Fetch recent (unlocked) price data
        run: python scripts/fetch_recent_prices.py

      - name: Rebuild dashboard
        run: python dashboard/build_dashboard.py

      - name: Commit refreshed dashboard
        run: |
          git config user.name "monthly-dashboard-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add phase2/data/extended dashboard/index.html dashboard/dashboard_data.json
          if git diff --cached --quiet; then
            echo "Nothing changed - not creating an empty commit."
          else
            git commit -m "Monthly dashboard refresh - $(date -u +%Y-%m-%d)"
            git push
          fi
